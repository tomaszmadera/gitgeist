[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgeist"
version = "0.9.0"
description = "Presents a Git repository as an emotional visual portrait"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pillow>=10.0.0",
]
image = [
    "pillow>=10.0.0",
]

[project.scripts]
gitgeist = "gitgeist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitgeist = ["normalization/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
